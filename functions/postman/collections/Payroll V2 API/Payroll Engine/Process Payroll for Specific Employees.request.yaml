$kind: http-request
description: Process payroll for specific employees only
url: "{{baseUrl}}/tenant/payroll/process"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "month": 12,
      "year": 2024,
      "employeeIds": ["{{employeeId}}"]
    }
order: 2000
