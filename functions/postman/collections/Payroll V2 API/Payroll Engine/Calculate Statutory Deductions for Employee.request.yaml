$kind: http-request
description: Calculate statutory deductions (PAYE, NHIF, NSSF, Housing Levy) for a specific employee based on gross taxable income
url: "{{baseUrl}}/tenant/payroll/statutory/{{employeeId}}?month=12&year=2024&grossTaxableIncome=75000"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: month
    value: "12"
  - key: year
    value: "2024"
  - key: grossTaxableIncome
    value: "75000"
    description: Gross taxable income for statutory calculations
order: 7000
