$kind: http-request
description: Admin/HR rejects leave request. Restores available balance.
url: "{{baseUrl}}/tenant/leave/request/:requestId/reject"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
pathVariables:
  requestId: leave-request-uuid
body:
  type: text
  content: |-
    {
      "comments": "Insufficient leave balance"
    }
order: 4000
