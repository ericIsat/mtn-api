$kind: http-request
description: Get employee classifications available in tenant's database
url: "{{baseUrl}}/tenant/employee-classifications?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: search
    value: executive
    disabled: true
  - key: isActive
    value: "true"
    disabled: true
order: 1000
