$kind: http-request
description: Assign payroll element to employees of specific types
url: "{{baseUrl}}/tenant/payroll-elements/bulk-assign"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "formulaId": "{{formulaId}}",
      "name": "Permanent Staff Bonus",
      "type": "allowance",
      "assignedAmount": 15000,
      "isCash": true,
      "effectiveFrom": "2025-01-01",
      "effectiveTo": "2025-12-31",
      "description": "Annual bonus for permanent staff",
      "isRecurring": false,
      "frequency": "annual",
      "assignmentType": "employee_type",
      "targetIds": ["{{employeeTypeId}}"
    }
order: 9000
