$kind: http-request
description: Get all payroll elements with optional filters
url: "{{baseUrl}}/tenant/payroll-elements?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: employeeId
    value: "{{employeeId}}"
    disabled: true
  - key: type
    value: allowance
    disabled: true
  - key: status
    value: active
    disabled: true
order: 3000
