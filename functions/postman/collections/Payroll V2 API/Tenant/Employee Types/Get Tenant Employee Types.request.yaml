$kind: http-request
description: Get employee types available in tenant's database (Tenant users only)
url: "{{baseUrl}}/tenant/employee-types?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: search
    value: full-time
    disabled: true
  - key: isActive
    value: "true"
    disabled: true
order: 1000
