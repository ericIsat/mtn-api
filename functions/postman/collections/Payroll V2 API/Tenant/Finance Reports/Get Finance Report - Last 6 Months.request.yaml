$kind: http-request
description: Get finance report with monthly chart data for the last 6 months (July through December)
url: "{{baseUrl}}/tenant/reports/finance?month=12&year=2024&page=1&limit=10&timePeriod=6"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: month
    value: "12"
    description: Payroll month (1-12)
  - key: year
    value: "2024"
    description: Payroll year
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: timePeriod
    value: "6"
    description: Last 6 months of data
order: 3000
