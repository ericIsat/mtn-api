$kind: http-request
description: Get variance report for all division cost centers
url: "{{baseUrl}}/tenant/cost-centers/reports/variance?startMonth={{startMonth}}&startYear={{startYear}}&endMonth={{endMonth}}&endYear={{endYear}}&entityType=division"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
queryParams:
  startMonth: "{{startMonth}}"
  startYear: "{{startYear}}"
  endMonth: "{{endMonth}}"
  endYear: "{{endYear}}"
  entityType: division
order: 4000
