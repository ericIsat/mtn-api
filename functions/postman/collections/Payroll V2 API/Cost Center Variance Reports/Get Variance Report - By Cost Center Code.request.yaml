$kind: http-request
description: Get variance report for specific cost center by code (e.g., CC-001)
url: "{{baseUrl}}/tenant/cost-centers/reports/variance?startMonth={{startMonth}}&startYear={{startYear}}&endMonth={{endMonth}}&endYear={{endYear}}&costCenterCode={{costCenterCode}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
queryParams:
  startMonth: "{{startMonth}}"
  startYear: "{{startYear}}"
  endMonth: "{{endMonth}}"
  endYear: "{{endYear}}"
  costCenterCode: "{{costCenterCode}}"
order: 2000
