$kind: http-request
description: Get variance report for all cost centers for specified period
url: "{{baseUrl}}/tenant/cost-centers/reports/variance?startMonth={{startMonth}}&startYear={{startYear}}&endMonth={{endMonth}}&endYear={{endYear}}"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
queryParams:
  startMonth: "{{startMonth}}"
  startYear: "{{startYear}}"
  endMonth: "{{endMonth}}"
  endYear: "{{endYear}}"
order: 1000
