$kind: http-request
description: Get all employee types (SmartPayday Admin only)
url: "{{baseUrl}}/master/employee-types?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: search
    value: developer
    disabled: true
  - key: isActive
    value: "true"
    disabled: true
order: 2000
