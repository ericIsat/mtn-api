$kind: http-request
description: Create new employee type (SmartPayday Admin only)
url: "{{baseUrl}}/master/employee-types"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "name": "Senior Developer",
      "description": "Senior software developers with 5+ years experience",
      "statutoryIds": ["statutory-uuid-1", "statutory-uuid-2"]
    }
order: 1000
