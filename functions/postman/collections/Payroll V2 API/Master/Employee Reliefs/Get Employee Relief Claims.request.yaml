$kind: http-request
url: "{{baseUrl}}/tenant/employee-reliefs?page=1&limit=10"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
queryParams:
  - key: page
    value: "1"
  - key: limit
    value: "10"
  - key: employeeId
    value: "{{employeeId}}"
    disabled: true
  - key: status
    value: Pending
    disabled: true
order: 2000
