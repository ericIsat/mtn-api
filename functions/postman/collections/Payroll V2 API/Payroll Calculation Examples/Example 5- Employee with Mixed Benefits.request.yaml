$kind: http-request
name: "Example 5: Employee with Mixed Benefits"
description: Example with cash allowances (taxable) + non-cash benefits like company car (non-taxable) + deductions like loan repayment
url: "{{baseUrl}}/tenant/payroll/calculate"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "month": 12,
      "year": 2024,
      "employeeIds": ["{{employeeId}}"],
      "includeCalculationBreakdown": true
    }
order: 5000
