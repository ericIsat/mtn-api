$kind: http-request
name: "Example 1: Basic Employee Calculation"
description: "Example calculation for employee with KES 50,000 basic pay, transport allowance KES 5,000, housing allowance KES 10,000. Expected: Gross KES 65,000, PAYE ~KES 6,500, NHIF ~KES 1,788, NSSF ~KES 2,160, Net ~KES 54,552"
url: "{{baseUrl}}/tenant/payroll/calculate"
method: POST
headers:
  Content-Type: application/json
  Authorization: Bearer {{accessToken}}
body:
  type: text
  content: |-
    {
      "month": 12,
      "year": 2024,
      "employeeIds": ["{{employeeId}}"],
      "includeCalculationBreakdown": true
    }
order: 1000
