$kind: http-request
description: Get analytics for benefit elements only
url: "{{baseUrl}}/tenant/payroll-element-analytics?timePeriod=12&month={{currentMonth}}&year={{currentYear}}&elementType=benefit"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
queryParams:
  timePeriod: "12"
  month: "{{currentMonth}}"
  year: "{{currentYear}}"
  elementType: benefit
order: 4000
