$kind: http-request
description: Get analytics for deduction elements only
url: "{{baseUrl}}/tenant/payroll-element-analytics?timePeriod=12&month={{currentMonth}}&year={{currentYear}}&elementType=deduction"
method: GET
headers:
  Authorization: Bearer {{accessToken}}
  Content-Type: application/json
queryParams:
  timePeriod: "12"
  month: "{{currentMonth}}"
  year: "{{currentYear}}"
  elementType: deduction
order: 5000
